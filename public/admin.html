<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JPay Admin</title>
<style>
body{font-family:sans-serif;background:#0f0f0f;color:#fff;padding:20px}
.card{background:#1e1e1e;padding:15px;border-radius:12px;margin:10px 0}
h1{color:#00ff88}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{padding:10px;border-bottom:1px solid #333;text-align:left}
th{color:#888}
.profit{color:#00ff88;font-size:24px;font-weight:bold}
.money{color:#ffcc00;font-size:20px}
</style>
</head>
<body>
<h1>🔒 JPay Admin Panel</h1>
<div class="card">
<div>Total Users Money: <span class="money" id="total">0</span> KES</div>
<div>Your Secret Profit (0711000000): <span class="profit" id="profit">0</span> KES</div>
<div>Users: <span id="count">0</span></div>
<button onclick="load()" style="margin-top:10px;padding:8px 16px;border-radius:8px;border:0;background:#00ff88;font-weight:bold">Refresh</button>
</div>
<div class="card">
<table>
<thead><tr><th>Name</th><th>Phone</th><th>Balance</th></tr></thead>
<tbody id="tbody"></tbody>
</table>
</div>
<script>
async function load(){
  const r = await fetch('/admin/users');
  const d = await r.json();
  document.getElementById('total').textContent = d.total_money;
  document.getElementById('profit').textContent = d.total_profit;
  document.getElementById('count').textContent = d.users.length;
  document.getElementById('tbody').innerHTML = d.users.map(u=>`<tr><td>${u.name}</td><td>${u.phone}</td><td>${u.balance} KES</td></tr>`).join('');
}
load();
setInterval(load, 3000);
</script>
</body>
</html>
