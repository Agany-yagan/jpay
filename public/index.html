<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JPay - Kenya</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{margin:0;background:#f5f5f5;padding:15px;max-width:500px;margin:auto}
.card{background:white;border-radius:12px;padding:20px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
h1{color:#00a651;text-align:center;margin:5px 0}
h2{font-size:16px;margin:0 0 10px;color:#333}
input,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ddd;font-size:16px}
button{background:#00a651;color:white;border:0;font-weight:bold}
button:active{background:#008a44}
.balance{font-size:28px;font-weight:bold;color:#00a651;text-align:center}
.small{font-size:12px;color:#666;text-align:center}
.success{color:green;font-weight:bold}
.error{color:red;font-weight:bold}
.row{display:flex;gap:10px}
</style>
</head>
<body>
<h1>JPay 🇰🇪</h1>
<p class="small">M-Pesa style wallet</p>

<div class="card">
<h2>1. Register</h2>
<input id="reg_phone" placeholder="Phone e.g 0711000001">
<input id="reg_name" placeholder="Name">
<input id="reg_pin" type="password" placeholder="PIN 4 digits" maxlength="4" inputmode="numeric">
<button onclick="register()">Register</button>
<div id="reg_msg"></div>
</div>

<div class="card">
<h2>2. Check Balance & Deposit</h2>
<div class="row">
<input id="bal_phone" placeholder="Phone">
<button onclick="balance()">Check</button>
</div>
<div id="bal_display" class="balance">-</div>
<input id="dep_amount" placeholder="Deposit amount">
<button onclick="deposit()">Virtual Deposit</button>
<div id="dep_msg"></div>
</div>

<div class="card">
<h2>3. Transfer Money (5 KES fee)</h2>
<input id="from_phone" placeholder="From phone">
<input id="to_phone" placeholder="To phone">
<input id="tr_amount" placeholder="Amount">
<input id="tr_pin" type="password" placeholder="Sender PIN" maxlength="4">
<button onclick="transfer()">Send Money</button>
<div id="tr_msg"></div>
</div>

<div class="card">
<h2>4. History</h2>
<input id="hist_phone" placeholder="Phone">
<button onclick="historyF()">View History</button>
<div id="hist_display" style="font-size:12px;white-space:pre-wrap;background:#f9f9f9;padding:10px;border-radius:8px;max-height:300px;overflow:auto"></div>
</div>

<div class="card" style="background:#eee;text-align:center">
<a href="/admin.html" style="color:#666;font-size:12px">Admin Login</a>
</div>

<script>
const API = '';
async function api(path, body){
  const res = await fetch(API+path, {method: body?'POST':'GET', headers:{'Content-Type':'application/json'}, body: body?JSON.stringify(body):null});
  return res.json();
}
async function register(){
  const phone=document.getElementById('reg_phone').value;
  const name=document.getElementById('reg_name').value;
  const pin=document.getElementById('reg_pin').value;
  if(pin.length!=4){ document.getElementById('reg_msg').innerHTML='<span class="error">PIN must be 4 digits</span>'; return; }
  const r=await api('/api/register',{phone,name,pin});
  document.getElementById('reg_msg').innerHTML = r.error?`<span class="error">${r.error}</span>`:`<span class="success">Registered ${r.user?r.user.name:name}</span>`;
}
async function balance(){
  const phone=document.getElementById('bal_phone').value;
  const r=await api('/balance/'+phone);
  document.getElementById('bal_display').innerText = r.error?r.error:`${r.name}: KES ${r.balance}`;
}
async function deposit(){
  const phone=document.getElementById('bal_phone').value;
  const amount=document.getElementById('dep_amount').value;
  const r=await api('/deposit',{phone,amount});
  document.getElementById('dep_msg').innerHTML = r.error?`<span class="error">${r.error}</span>`:`<span class="success">New balance KES ${r.new_balance}</span>`;
  balance();
}
async function transfer(){
  const from_phone=document.getElementById('from_phone').value;
  const to_phone=document.getElementById('to_phone').value;
  const amount=document.getElementById('tr_amount').value;
  const pin=document.getElementById('tr_pin').value;
  const r=await api('/transfer',{from_phone,to_phone,amount,pin});
  document.getElementById('tr_msg').innerHTML = r.error?`<span class="error">${r.error}</span>`:`<span class="success">Sent ${r.amount} KES, Fee ${r.fee} KES</span>`;
}
async function historyF(){
  const phone=document.getElementById('hist_phone').value;
  const r=await api('/history/'+phone);
  document.getElementById('hist_display').innerText = JSON.stringify(r,null,2);
}
</script>
</body>
</html>
